[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflow-compiler"
version = "0.1.0"
description = "Compile business workflow documents into metadata, facts, canonical graphs, CVPA classifications, Mermaid diagrams, and Temporal workflow designs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "workflow-compiler maintainers" }]
keywords = ["workflow", "compiler", "temporal", "mermaid", "cvpa", "graph"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "networkx>=3.3",
    "jinja2>=3.1",
    "loguru>=0.7",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Document ingestion
    "python-docx>=1.1",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    # Test-only fixture generation
    "reportlab>=4.1",
]

[project.scripts]
workflow-compiler = "workflow_compiler.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_compiler"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI and Typer rely on callables in argument defaults (Depends/Argument/Option).
"src/workflow_compiler/api/app.py" = ["B008"]
"src/workflow_compiler/cli/main.py" = ["B008"]
# __all__ is grouped by domain area on purpose rather than sorted alphabetically.
"src/workflow_compiler/models/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
