[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflow-compiler"
version = "0.1.0"
description = "Compile business workflow documents into metadata, facts, canonical graphs, CVPA classifications, Mermaid diagrams, and Temporal workflow designs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "workflow-compiler maintainers" }]
keywords = ["workflow", "compiler", "temporal", "mermaid", "cvpa", "graph"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "networkx>=3.3",
    "jinja2>=3.1",
    "loguru>=0.7",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Document ingestion
    "python-docx>=1.1",
    "pypdf>=4.2",
    # Knowledge bases (vendored Context Hub reads curated domain YAML + xlsx corpora)
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
# Running generated bundles from inside the app. Optional on purpose: the API
# imports cleanly without it and reports Temporal as unavailable, so a
# compile-only install stays lean.
run = [
    "temporalio>=1.7",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    # Test-only fixture generation
    "reportlab>=4.1",
    # Runtime tests for the generated Temporal bundles
    "temporalio>=1.7",
]

[project.scripts]
workflow-compiler = "workflow_compiler.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_compiler"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# examples/knowledge_bases/* are verbatim third-party corpora (never linted or collected).
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI and Typer rely on callables in argument defaults (Depends/Argument/Option).
"src/workflow_compiler/api/app.py" = ["B008"]
"src/workflow_compiler/api/auth.py" = ["B008"]
"src/workflow_compiler/cli/main.py" = ["B008"]
"src/workflow_compiler/cli/kb.py" = ["B008"]
# __all__ is grouped by domain area on purpose rather than sorted alphabetically.
"src/workflow_compiler/models/__init__.py" = ["RUF022"]
# Vendored Context Hub subset (kg/contexthub/VENDORED.md): upstream style is kept
# verbatim so the pinned diff stays reviewable; only correctness rules apply.
"src/workflow_compiler/kg/contexthub/**" = ["E501", "I001", "SIM102", "UP", "RUF", "C420", "F401", "F841"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# The vendored Context Hub subset is untyped upstream code pinned at a SHA; the
# typed surface workflow-compiler relies on is kg/service.py.
[[tool.mypy.overrides]]
module = "workflow_compiler.kg.contexthub.*"
ignore_errors = true
